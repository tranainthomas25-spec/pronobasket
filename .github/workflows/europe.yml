name: Donnees ligues europeennes
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node europe.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/europe.json
          git diff --cached --quiet || (git commit -m "Donnees ligues europeennes" && git pull --rebase && git push)
